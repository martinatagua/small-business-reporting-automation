[project]
name = "small-business-reporting-automation"
version = "0.0.0"
description = "Validated, traceable ingestion of CSV and Excel sales files for small retailers (portfolio demo)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openpyxl>=3.1,<4",
    # P-07: pandas solo tras la lectura y normalización (consolidación, tablas, KPIs); nunca lee las fuentes.
    "pandas>=2.2,<4",
]

[project.scripts]
sb-report = "small_business_reporting_automation.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
